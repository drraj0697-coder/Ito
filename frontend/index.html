<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedQ Online">
  <meta name="description" content="An online-first medical question bank PWA.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <title>MedQ Online</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="back-button" class="icon-button hidden" aria-label="Go back">←</button>
      <div class="brand"><span class="brand-mark">M</span><span>MedQ <b>Online</b></span></div>
      <div id="connection" class="connection" title="Question data requires an internet connection"><span class="status-dot"></span><span>Online</span></div>
    </header>
    <div id="notice" class="notice hidden" role="status"></div>
    <main id="screen" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-nav="subjects" class="nav-item"><span>▦</span><small>Subjects</small></button>
      <button data-nav="search" class="nav-item"><span>⌕</span><small>Search</small></button>
      <button data-nav="profile" class="nav-item"><span>◉</span><small>Profile</small></button>
    </nav>
  </div>
  <noscript>This app needs JavaScript to request its live question bank.</noscript>
  <!-- Public configuration only. GitHub Actions replaces the placeholder from a repository variable. -->
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
